<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Maradona Menotti - Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
      text-align: center;
      max-width: 500px;
    }
    .badge {
      display: inline-block;
      background: #10b981;
      color: #064e3b;
      font-weight: bold;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    h1 { margin-top: 0; font-size: 1.8rem; }
    p { color: #94a3b8; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">DOCKER MULTI-STAGE: ACTIVO</div>
    <h1>Maradona Menotti</h1>
    <p>Esta aplicación fue compilada con Node.js y ahora se sirve únicamente como estático optimizado sobre Nginx.</p>
  </div>
</body>
</html>
